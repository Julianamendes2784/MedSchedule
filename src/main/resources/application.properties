# Nome da aplicação (aparece nos logs).
spring.application.name=MedSchedule


# --- Conexão com o PostgreSQL ---
# URL JDBC: host (localhost), porta (5432, padrão do PostgreSQL) e nome do banco (medschedule).
# O banco "medschedule" precisa existir antes de subir a API (o Hibernate cria as tabelas, não o banco).
spring.datasource.url=jdbc:postgresql://localhost:5432/medschedule
# Driver que sabe "conversar" com o PostgreSQL.
spring.datasource.driver-class-name=org.postgresql.Driver
# Usuário e senha do PostgreSQL (definidos na instalação).
spring.datasource.username=postgres
spring.datasource.password=
# Carrega a senha real de application-local.properties, arquivo ignorado pelo Git (opcional: se não existir, segue sem erro).
spring.config.import=optional:classpath:application-local.properties

# --- JPA / Hibernate (ORM) ---
# update = ao subir, o Hibernate cria/ajusta as tabelas a partir das classes @Entity.
spring.jpa.hibernate.ddl-auto=update
# Mostra no console os SQLs gerados (bom para demonstrar na avaliação).
spring.jpa.show-sql=true
# Formata o SQL do log em várias linhas para facilitar a leitura.
spring.jpa.properties.hibernate.format_sql=true
# Dialeto: ensina o Hibernate a gerar SQL específico do PostgreSQL.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# --- Login da API (HTTP Basic do Spring Security) ---
# Usuário e senha exigidos pelo Postman/Swagger nas rotas protegidas.
# A senha está criptografada com BCrypt ({bcrypt} indica o algoritmo); não é texto puro.
